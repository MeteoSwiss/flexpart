[[tool.poetry.source]]
name = "meteoswiss"
url = "https://service.meteoswiss.ch/nexus/repository/python-all/simple"
priority = "primary"

[tool.poetry]
name = "flexpart-ifs-utils"
version = "1.0.0"
description = "Library for preparing Flexpart-IFS jobs."
authors = ["MeteoSwiss"]

[tool.poetry.dependencies]
python = "~3.13"
boto3 = "^1.43.127"
botocore = "^1.43.127"
pyyaml = "^6.0.3"
jinja2 = "^3.1.6"
eccodes = ">=2.37"
mchpy = "^4.2.2"
types-pyyaml = "^6.0.12.20261103"
findlibs = ">=0.1.5"

[tool.poetry.group.dev.dependencies]
pytest-cov = "^7.1.0"
pytest-mock = "^3.17.0"
pylint = "^4.1.3"
ruff = ">=0.17.4,<0.18.0"
mypy = "^2.4.1"
sphinx = "^9.2.0"
importlib_resources = "^7.1.0"
pydata-sphinx-theme = "^0.24.0"
sphinx-autoapi = "^3.9.0"
moto = {extras = ["server", "s3"], version = "^5.2.5"}
python-dotenv = "^1.2.4"

[tool.ruff]
line-length = 120

[tool.pylint.master]
disable = [
    'C0114', # missing-module-docstring
    'C0115', # missing-class-docstring
    'C0116', # missing-function-docstring
]

[tool.pylint.basic]
argument-naming-style = 'any'
attr-naming-style = 'any'

[tool.pylint.format]
# Maximum number of lines in a module.
max-line-length = 120

[tool.pylint.design]
# Minimum number of public methods for a class (see R0903).
min-public-methods = 0

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# to avoid mypy errors when importing modules from commons
# aka "module is installed, but missing library stubs or py.typed marker"
module = ["mchpy.*"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# Always list why tests were skipped (e.g. a missing FLEXPART_PREFIX or TEST_DATA).
addopts = "-rs"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
