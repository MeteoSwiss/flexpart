logging:
  root_log_level: INFO
  # When running in k8s, use JSON logger via env setting
  # formatter: json
  formatter: "json"
  child_log_levels:
    mchpy: DEBUG
    mchpy.audit.http_audit: INFO
main:
  app_name: Flexpart-IFS
  openmp_config:
    num_threads: 16
    stack_size: 100M
  input:
    step_unit: hours
  runtime_config:
    site_config_key_prefix: "sites/"
  aws:
    s3:
      output:
        region: eu-central-2
        name: flexpart-output
        retries: 10
      site_config:
        region: eu-central-2
        name: flexpart-ifs-static-input
        retries: 10
      input_manifest:
        region: eu-central-2
        retries: 10
        # Files downloaded in parallel (and the client's connection pool size). Tune per environment
        # with MAIN__AWS__S3__INPUT_MANIFEST__MAX_CONCURRENT_DOWNLOADS; compare the MiB/s in the
        # "Downloaded ... from manifest" log line.
        max_concurrent_downloads: 16
      # Buffer per download stream (1 MiB, as in lagranto).
      download_chunk_size_bytes: 1048576
